<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星语 · JSA 留言星系</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0e1a;
            color: #e0e8ff;
            height: 100vh;
            overflow:hidden;
        }
        #starCanvas{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
        }
        .wrap{
            position:relative;z-index:2;
            width:100%;height:100vh;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:20px;
        }
        textarea{
            width:min(90%,420px);
            height:120px;
            background:rgba(255,255,255,0.08);
            border:1px solid #445588;
            color:#e0e8ff;
            border-radius:12px;
            padding:12px;font-size:15px;resize:none;outline:none;
        }
        button{
            margin-top:12px;
            padding:10px 24px;
            background:#3458bb;color:#fff;
            border:none;border-radius:8px;font-size:15px;
        }
        #msgList{
            width:min(90%,420px);
            max-height:260px;overflow:auto;
            margin-top:16px;
        }
        .item{
            background:rgba(255,255,255,0.06);
            padding:10px 12px;border-radius:8px;margin:6px 0;
        }
    </style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="wrap">
    <h2>星语留言星系</h2>
    <textarea id="inputBox" placeholder="写下你的留言..."></textarea>
    <button id="sendBtn">发送留言</button>
    <div id="msgList"></div>
</div>

<script>
//星空背景
const canvas=document.getElementById('starCanvas');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();window.addEventListener('resize',resize);
let stars=[];
for(let i=0;i<220;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.2+0.2,
        spd:Math.random()*0.4+0.05
    })
}
function draw(){
    ctx.fillStyle="#0a0e1a";ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(220,230,255,${0.3+Math.random()*0.7})`;ctx.fill();
        s.y+=s.spd;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
    })
    requestAnimationFrame(draw);
}
draw();

//留言逻辑
const inputBox=document.getElementById('inputBox');
const sendBtn=document.getElementById('sendBtn');
const msgList=document.getElementById('msgList');

async function loadMsg(){
    try{
        const res=await fetch("/list");
        const arr=await res.json();
        msgList.innerHTML="";
        arr.forEach(item=>{
            const div=document.createElement('div');
            div.className="item";div.innerText=item.content;
            msgList.appendChild(div);
        })
    }catch(e){console.log("读取失败",e);}
}
loadMsg();

sendBtn.onclick=async ()=>{
    const content=inputBox.value.trim();
    if(!content)return;
    try{
        await fetch("/save",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({content})
        })
        inputBox.value="";
        loadMsg();
    }catch(err){
        alert("发送失败");
    }
}
</script>
</body>
</html>
